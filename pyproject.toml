[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyros-builder"
version = "0.1.0"
description = "A Python build tool for Cyros"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Ryan Cornish" }
]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
  "Topic :: Software Development :: Build Tools"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cyros-builder = "cyros_builder.cli:main"

[tool.pytest.ini_options]
# Confine collection to tests/. Without this pytest walks the package and
# collects cyros_builder/test_model.py, test_planner.py and test_runner.py as
# test modules — they are production code whose test_ prefix refers to the C++
# tests they orchestrate, and collection fails on import.
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["cyros_builder*"]
