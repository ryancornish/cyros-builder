[test]
name   = "mini_case"
layer  = 1
source = "mini_case.cpp"
config = "../../../build/configs/mini.hpp"

[components]
# port here is a FILTER: the test is skipped unless the profile selects one of
# these. It never selects the port itself.
port = ["porta"]
time_driver = "tick"
features = ["alpha"]

[link]
system_libraries = ["pthread"]
# Resolved relative to this file. Pins that a script is a link INPUT, which
# is what makes an edit to it relink the test.
linker_script = "mini.ld"
