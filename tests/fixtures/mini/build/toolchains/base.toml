name = "mini-base"

[tools]
cc  = "gcc"
cxx = "g++"
ar  = "ar"
asm = "as"

[flags]
common = ["-DBASE", "-DDROP_ME"]
c      = ["-std=c17"]
cxx    = ["-std=c++20"]
asm    = ["-DASM"]
link   = []

[settings]
family = "gcc"
debug = false
optimization = "O1"
warnings_as_errors = true

[archive]
strategy = "simple"
