# A bare-metal profile whose toolchain supplies the board.
[profile]
name = "board"
toolchain = "../toolchains/board.toml"
config_header = "../configs/mini.hpp"

[layout]
source_root = "../../src"
output_root = "../../out"

[components]
port = "porta"
time_driver = "tick"

[features]
enable = []

[output]
archive = "libmini.a"
